[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps-internet"
version = "0.1.0"
description = "Read PowerSchool parent-portal grades and missing assignments."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32",
]

[project.scripts]
ps-internet = "ps_internet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ps_internet = ["templates/*.html", "static/*"]
